# Worktrunk (`wt`) user config, stowed into every devcontainer.
#
# Worktrees go inside the repo so they survive a container rebuild (the repo is
# the bind mount) -- the same place workmux put them, so existing
# .worktrees/<slug> checkouts keep working.
worktree-path = "{{ repo_path }}/.worktrees/{{ branch | sanitize }}"

# Link node_modules from the main checkout into a new worktree, like workmux's
# files.symlink did. Skipped when there is nothing to link or the checkout has
# its own.
pre-start = "[ -e '{{ repo_path }}/node_modules' ] && [ ! -e '{{ worktree_path }}/node_modules' ] && ln -s '{{ repo_path }}/node_modules' '{{ worktree_path }}/node_modules' || true"

# Hand the checkout to herdr as a grouped workspace. That emits
# worktree.opened, which the jm.portals-bootstrap plugin's layout.sh turns into
# the tab layout. `|| true` so a `wt` run outside herdr is not an error.
post-switch = "herdr worktree open --path '{{ worktree_path }}' >/dev/null 2>&1 || true"
