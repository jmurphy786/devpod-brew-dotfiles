# Local herdr plugin: what herdr's built-in worktree support does not cover --
# a worktree menu that works from a linked worktree (worktrunk), and the
# branch glyph and gh-stack layer index in the spaces sidebar. Removing and
# closing worktrees are herdr's own.
#
# Linked, not installed, so it stays editable in place:
#   herdr plugin link ~/dotfiles/herdr-plugins/portals-bootstrap

id = "jm.portals-bootstrap"
name = "Portals bootstrap"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Worktree menu and gh-stack sidebar index"
platforms = ["linux", "macos"]

# Publish the sidebar tokens for a worktree workspace (layout.sh). No tabs are
# created: a worktree opens as one plain tab.
#
# Both events are needed. Worktrunk's post-switch hook runs `herdr worktree
# open`, which emits worktree.opened; worktree.created covers herdr's own
# `worktree create`.
[[events]]
on = "worktree.created"
command = ["bash", "layout.sh"]

[[events]]
on = "worktree.opened"
command = ["bash", "layout.sh"]

# Re-read the index after `gh stack add|modify|up|down`, which shift every
# layer without changing anything herdr can observe on its own. This is the
# replacement for stack-pane-title.sh's SIGUSR1 to the workmux sidebar daemon.
[[actions]]
id = "stack-refresh"
title = "Refresh gh-stack index"
contexts = ["workspace"]
command = ["bash", "stack.sh", "--all"]

# Re-read listening ports now instead of waiting for the next poll tick. The
# poller itself is started by layout.sh on worktree.created / worktree.opened.
[[actions]]
id = "ports-refresh"
title = "Refresh listening ports"
contexts = ["workspace"]
command = ["bash", "ports.sh", "--once"]

# The `prefix S` gh-stack menu, ported off tmux display-menu.
[[panes]]
id = "gh-stack"
title = "gh stack"
placement = "popup"
width = "50%"
height = "40%"
command = ["bash", "gh-stack.sh"]

# A keybinding can invoke an action but not a pane entrypoint, so this is the
# hop that lets prefix+S open the popup above.
[[actions]]
id = "gh-stack-open"
title = "gh stack"
contexts = ["workspace"]
command = ["sh", "-c", '"$HERDR_BIN_PATH" plugin pane open --plugin jm.portals-bootstrap --entrypoint gh-stack']

# ctrl+h/j/k/l pane focus that yields to nvim/vim (nav.sh). One action per
# direction because a keybinding cannot pass arguments.
[[actions]]
id = "nav-left"
title = "Focus pane left (nvim-aware)"
contexts = ["workspace"]
command = ["bash", "nav.sh", "left"]

[[actions]]
id = "nav-down"
title = "Focus pane down (nvim-aware)"
contexts = ["workspace"]
command = ["bash", "nav.sh", "down"]

[[actions]]
id = "nav-up"
title = "Focus pane up (nvim-aware)"
contexts = ["workspace"]
command = ["bash", "nav.sh", "up"]

[[actions]]
id = "nav-right"
title = "Focus pane right (nvim-aware)"
contexts = ["workspace"]
command = ["bash", "nav.sh", "right"]

# The worktree menu (prefix+w): an o / a letter menu, then a list. Works from
# a linked worktree, unlike herdr's built-in New/Open worktree.
[[panes]]
id = "wt-menu"
title = "worktrees"
placement = "popup"
width = "50%"
height = "40%"
command = ["bash", "wt-menu.sh"]

[[actions]]
id = "wt-menu-open"
title = "Worktrees: open / add"
contexts = ["workspace"]
command = ["sh", "-c", '"$HERDR_BIN_PATH" plugin pane open --plugin jm.portals-bootstrap --entrypoint wt-menu']
