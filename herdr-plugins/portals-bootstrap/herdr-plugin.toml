# Local herdr plugin: what herdr's built-in worktree support does not cover --
# a worktree picker that works from a linked worktree (worktrunk), the
# per-worktree symlinks and tab layout, and the gh-stack layer index in the
# spaces sidebar. Opening, removing and closing worktrees are herdr's own.
#
# Linked, not installed, so it stays editable in place:
#   herdr plugin link ~/dotfiles/herdr-plugins/portals-bootstrap

id = "jm.portals-bootstrap"
name = "Portals bootstrap"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Worktree picker, tab layout, symlinks and gh-stack sidebar index"
platforms = ["linux", "macos"]

# Lay out a new worktree workspace: the files.symlink links, then the tabs
# from the `windows:` block of the repo's .workmux.yaml (falling back to
# ~/.config/workmux/config.yaml).
#
# Both events are needed. Worktrunk's post-switch hook runs `herdr worktree
# open`, which emits worktree.opened; worktree.created covers herdr's own
# `worktree create`. layout.sh ignores an
# already_open workspace and one that already has more than a single tab, so
# re-opening a closed worktree does not stack a second set of tabs on it.
[[events]]
on = "worktree.created"
command = ["bash", "layout.sh"]

[[events]]
on = "worktree.opened"
command = ["bash", "layout.sh"]

# Re-read the index after `gh stack add|modify|up|down`, which shift every
# layer without changing anything herdr can observe on its own. This is the
# replacement for stack-pane-title.sh's SIGUSR1 to the workmux sidebar daemon.
[[actions]]
id = "stack-refresh"
title = "Refresh gh-stack index"
contexts = ["workspace"]
command = ["bash", "stack.sh", "--all"]

# The `prefix S` gh-stack menu, ported off tmux display-menu.
[[panes]]
id = "gh-stack"
title = "gh stack"
placement = "popup"
width = "80%"
height = "80%"
command = ["bash", "gh-stack.sh"]

# A keybinding can invoke an action but not a pane entrypoint, so this is the
# hop that lets prefix+S open the popup above.
[[actions]]
id = "gh-stack-open"
title = "gh stack"
contexts = ["workspace"]
command = ["sh", "-c", '"$HERDR_BIN_PATH" plugin pane open --plugin jm.portals-bootstrap --entrypoint gh-stack']

# The worktree picker: worktrunk's `wt switch` over worktrees, local and remote
# branches, and open PRs, or a typed new name. Works from a linked worktree,
# unlike herdr's built-in New/Open worktree.
[[panes]]
id = "wt-switch"
title = "worktrees"
placement = "popup"
width = "80%"
height = "80%"
command = ["bash", "wt-switch.sh"]

[[actions]]
id = "wt-switch-open"
title = "Worktrees: open / new from branch / remote / PR"
contexts = ["workspace"]
command = ["sh", "-c", '"$HERDR_BIN_PATH" plugin pane open --plugin jm.portals-bootstrap --entrypoint wt-switch']
