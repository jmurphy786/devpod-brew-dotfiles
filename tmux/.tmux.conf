# Reload config with Prefix+r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

set -g set-clipboard on
set -g allow-passthrough on

set -g renumber-windows on
set -g mouse on
set -g mode-keys vi

set -g exit-empty off

# `#()` output in the status line is cached for a whole status-interval, and the
# default 15s is what made the branch and its stack layer take that long to
# catch up after a `gh stack up`. tmux-branch.sh is a few milliseconds a tick,
# so a one-second cadence costs well under 1% of a core.
set -g status-interval 1

# Workmux binds
bind p run-shell -b "workmux sidebar"

bind q kill-window
bind x kill-pane

set -g base-index 1
setw -g pane-base-index 1

set -g repeat-time 1000  # 1 second to keep pressing

# ~/.tmux.conf
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ',*:cud1=\E[1B'
set -sa terminal-features ',xterm-256color:RGB'

# Force proper window sizing
setw -g aggressive-resize on

# Fix rendering issues
set -g focus-events on

bind-key j command-prompt -p "join pane from:" "join-pane -s '%%'"
bind-key b break-pane

set-option -g status-position top
# Swap current pane with pane in that direction

# ~/.tmux.conf
# Alt+Shift+hjkl to swap panes (no prefix needed)
bind-key -r h swap-pane -U  # Swap with pane above
bind-key -r j swap-pane -D  # Swap with pane below  
bind-key -r k swap-pane -U  # Swap with pane above
bind-key -r l swap-pane -D  # Swap with pane below


# Capital letters for resizing in specific directions
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour208'  # Bright border for active
set -g window-style 'fg=colour250,bg=default'
set -g window-active-style 'fg=colour255,bg=default'

set -g pane-border-lines heavy

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
#set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
#set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-restore 'on'
# set -g @continuum-save-interval '15'
# set -g @resurrect-capture-pane-contents 'on'
# set -g @resurrect-strategy-nvim 'session'
# set -g @resurrect-save-command-strategy 'pane'

# Resurrect restores dotnet
#set -g @resurrect-processes 'ssh ~dotnet lazygit "npm run*" docker-compose tail python node'

# Custom status bar that shows window names
set -g status-style bg=colour235,fg=colour136
# The window list owns the left edge. The branch and the gh-stack layer it is
# on sit on the right, just before the clock, sized to their own content -- a
# fixed block left a run of padding whenever the branch name was short. 36 is
# now a cap rather than a width, and the #[default] between the two blocks
# keeps them reading as two blocks instead of one bar.
set -g status-left ''
set -g status-right '#[fg=colour235,bg=colour136,bold] #(~/.config/tmux/tmux-branch.sh "#{pane_current_path}" 36) #[default] #[fg=colour235,bg=colour136,bold] %H:%M '
set -g status-left-length 10

# Session names carry the repo and a slugified workmux handle, not the branch --
# show the real branch from git, in the status bar and the terminal title.
set -g set-titles on
set -g set-titles-string '#(~/.config/tmux/tmux-branch.sh "#{pane_current_path}")'
set -g status-right-length 100

# Window status - THIS IS THE KEY PART
set -g window-status-format '#[fg=colour244,bg=colour235] #I:#W '
set -g window-status-current-format '#[fg=colour235,bg=colour136,bold] #I:#W '

# The workmux sidebar has no template placeholder for a gh-stack layer, so the
# index is written into the agent pane's title, which the sidebar does render.
# Re-apply it whenever the client lands on another worktree session, so one
# opened fresh is labelled without opening the stack menu first.
set-hook -g client-session-changed 'run-shell -b "~/.config/tmux/stack-pane-title.sh"'

run '~/.tmux/plugins/tpm/tpm'

bind w display-menu -x C -y C -T "workmux" \
    "add" a "popup -d '#{pane_current_path}' -w 80% -h 20% -x C -y C -E '~/.config/tmux/workmux-add-branch.sh \"#{session_name}\"'" \
    "add w/branch" b "popup -d '#{pane_current_path}' -w 80% -h 80% -x C -y C -E '~/.config/tmux/workmux-add-from-branch.sh \"#{session_name}\"'" \
    "add w/prompt" p "popup -d '#{pane_current_path}' -w 80% -h 20% -x C -y C -E '~/.config/tmux/workmux-add-prompt.sh \"#{session_name}\"'" \
    "open" o "popup -d '#{pane_current_path}' -w 80% -h 60% -x C -y C -E '~/.config/tmux/workmux-fzf.sh open \"#{session_name}\"'" \
    "remove" r "popup -d '#{pane_current_path}' -w 80% -h 60% -x C -y C -E '~/.config/tmux/workmux-fzf.sh remove \"#{session_name}\"'" \
    "close" c "popup -d '#{pane_current_path}' -w 80% -h 60% -x C -y C -E '~/.config/tmux/workmux-fzf.sh close \"#{session_name}\"'" \
    "dashboard" d "popup -d '#{pane_current_path}' -w 90% -h 90% -x C -y C -E 'workmux dashboard'" \
    "sidebar" s "run-shell 'workmux sidebar'" \
    "quit" q ""

bind g popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"
bind R popup -d "#{pane_current_path}" -w 90% -h 90% -E "tuicr"
# Not a popup, unlike its neighbours: tmux popups cannot render sixel, so image
# previews come out blank. A full-width zoomed split gives the same
# fills-the-window feel from a real pane, and closes back to where you were.
bind y split-window -f -Z -c "#{pane_current_path}" "yazi"
bind @ popup -w 100% -h 40% -x C -y 9999 -E "$HOME/.config/tmux/tmux-file-picker.sh"


# New windows and splits inherit the current pane's directory, so inside a
# workmux worktree session they open in the worktree, not the main repo.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"


# gh stack gets its own key rather than joining the workmux `w` menu: stacked
# PRs are a separate concern from worktree lifecycle, and keeping them apart
# means either half can be swapped out on its own.
#
# A display-menu rather than an fzf popup, for the same reason `w` is one: a
# popup's size is fixed when it opens and cannot be changed afterwards, so one
# popup cannot be both a small seven-row chooser and a full-screen host for the
# view/modify/submit TUIs. The menu sizes itself to its rows; each row then
# opens a popup at the size that action needs. The title reuses the status-left
# branch helper, whose output tmux already has cached.
bind S display-menu -x C -y C \
    -T "gh stack #(~/.config/tmux/tmux-branch.sh '#{pane_current_path}')" \
    "view" v "popup -d '#{pane_current_path}' -w 90% -h 90% -x C -y C -E '~/.config/tmux/gh-stack-fzf.sh view'" \
    "modify" m "popup -d '#{pane_current_path}' -w 90% -h 90% -x C -y C -E '~/.config/tmux/gh-stack-fzf.sh modify'" \
    "submit" s "popup -d '#{pane_current_path}' -w 90% -h 90% -x C -y C -E '~/.config/tmux/gh-stack-fzf.sh submit'" \
    "push" p "popup -d '#{pane_current_path}' -w 80% -h 60% -x C -y C -E '~/.config/tmux/gh-stack-fzf.sh push'" \
    "sync" y "popup -d '#{pane_current_path}' -w 80% -h 60% -x C -y C -E '~/.config/tmux/gh-stack-fzf.sh sync'" \
    "checkout" c "popup -d '#{pane_current_path}' -w 80% -h 60% -x C -y C -E '~/.config/tmux/gh-stack-fzf.sh checkout'" \
    "add" a "popup -d '#{pane_current_path}' -w 80% -h 20% -x C -y C -E '~/.config/tmux/gh-stack-fzf.sh add'" \
    "quit" q ""


