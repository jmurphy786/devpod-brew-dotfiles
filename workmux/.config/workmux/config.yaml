# each worktree opens as a seperate session as opposed to windows
mode: session
# don't add dagent icons to tmux windows
status_format: false
# enable nerd fonts, duh
nerdfont: true
# default agent
agent: claude 

window_prefix: "{project} 󰘬 "

# default window layout
windows:
  - name: dev 
    panes:
      - command: nvim
        focus: true
  - name: runner 
  - name: git
    panes:
       - command: lazygit
         focus: true 
  - name: agent
    panes:
      - command: claude 

