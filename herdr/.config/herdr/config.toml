onboarding = false

[theme]
name="catpuccin"

[keys]
prefix = "ctrl+b"

focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

split_vertical = "prefix+%"
split_horizontal = "prefix+,"

new_tab = "prefix+c"

toggle_sidebar = "prefix+p"


[[keys.command]]
key = "prefix+w"
type = "popup"
command = "bash -ic wt-fzf"
description = "worktree: open or create"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+d"
type = "pane"
command = "bash -ic wt-fzf-remove"
description = "worktree: remove"


