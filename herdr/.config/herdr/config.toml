onboarding = false

# Container (server) half of the herdr setup. The WSL2 host runs the herdr
# client and drives this container as a saved machine; the theme, keys and
# sidebar come from the host's config in jmurphy786/dotfiles (wsl/herdr), not
# from here. This file covers what the server applies to panes running in the
# container, including the [[keys.command]] plugin_action keys at the bottom:
# custom commands are server-side config, so they live next to the
# jm.portals-bootstrap plugin (local-plugins/, linked by setup.sh) they run.

# Only reached by herdr's own New worktree dialog, which the host parks on
# prefix+alt+g. The prefix+w menu (wt-menu.sh) puts checkouts in
# <repo>/.worktrees instead.
[worktrees]
directory = "~/.herdr/worktrees"

# After the container restarts and herdr-up.sh starts the server again:
# workspaces, tabs and pane directories come back from session.json, claude
# sessions resume through the herdr claude integration (setup.sh installs it),
# and pane_history brings back each pane's scrollback.
[session]
resume_agents_on_restore = true

[experimental]
pane_history = true

# Custom commands are server-side config: the host client does not forward a
# keys.command it doesn't have itself, so the plugin binds have to live here, on
# the server that has the plugin, not in the host's config (they were moved
# there in 24d4320 and stopped working in every container).
#
# A built-in wins a key clash and the keys.command on it is disabled, so the
# two defaults these keys would collide with are moved: goto (the client's
# agent/terminal picker, the one that switches machines) is prefix+g by default
# and now lives on prefix+shift+g; new_worktree is prefix+shift+g by default and
# is parked on a chord nothing uses.
#
# The workspace navigator moves from prefix+w to prefix+h (nvim-style) and the
# worktree menu takes prefix+w.
#
# ctrl+h/j/k/l are plugin_action keys (herdr-navigator below), not the built-in
# focus_pane_*: a built-in swallows the key before nvim sees it. The built-ins
# move to alt+h/j/k/l so they no longer clash.
[keys]
goto = "prefix+shift+g"
new_worktree = "prefix+alt+g"
workspace_picker = "prefix+h"
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"

# The host config sets these too. They are repeated here because the host's
# per-machine tabs run `herdr --remote --remote-keybindings server`, which uses
# this file's keys and not the host's.
split_vertical = "prefix+%"
split_horizontal = "prefix+,"
toggle_sidebar = "prefix+p"
remove_worktree = "prefix+d"

# Navigate mode (prefix+h): j/k move the workspace selection, vim-style.
# j/k were pane focus here by default, so that moves to ctrl+j/k. h/l stay pane
# left/right.
navigate_workspace_down = ["j", "down"]
navigate_workspace_up = ["k", "up"]
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"

# Workspace cycling without entering navigate mode. Repeated from the host
# config for the same reason as the split keys above.
next_workspace = "ctrl+shift+j"
previous_workspace = "ctrl+shift+k"

# Pane focus that hands ctrl+hjkl to nvim when it is in the foreground, and
# nvim hands it back at its edge. Both halves come from
# kaar/nvim-herdr-navigator (herdr plugin install kaar/nvim-herdr-navigator,
# lua/plugins/herdr-navigator.lua in nvim).
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-navigator.left"
description = "navigate left (nvim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-navigator.down"
description = "navigate down (nvim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-navigator.up"
description = "navigate up (nvim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-navigator.right"
description = "navigate right (nvim/herdr)"

# The chords above shadow ctrl+l (clear screen) in shells; this puts it back.
[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane send-keys \"$HERDR_ACTIVE_PANE_ID\" ctrl+l"
description = "send ctrl+l (clear screen) to pane"

# Worktree menu: o open this repo's worktrees, a add one from a local or remote
# branch.
[[keys.command]]
key = "prefix+w"
type = "plugin_action"
command = "jm.portals-bootstrap.wt-menu-open"
description = "worktrees: open / add"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "jm.portals-bootstrap.gh-stack-open"
description = "gh stack"

# Popups run in the focused pane's directory, so these open on the current
# worktree. The host config has the same two for Local workspaces.
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "tuicr"
description = "tuicr review"
width = "90%"
height = "90%"
